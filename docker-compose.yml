# 一客户一实例的最小部署单元：backend + frontend + 持久卷。
# 用法：cp .env.example .env 填好密钥 → docker compose up -d
# HTTPS：生产建议前置 Caddy/Nginx 反代 3000 端口（证书在反代层）。
services:
  backend:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      WORKSPACE_ROOT: /app/workspaces
    volumes:
      - lilies-data:/app/data
      - lilies-workspaces:/app/workspaces
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build: platform/frontend
    environment:
      AGENT_PLATFORM_URL: http://backend:8001
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  # 备份兜底服务（可选，不随默认 up 启动）：docker compose --profile backup up -d backup
  # 每 86400 秒做一次简化备份：cp SQLite 主库 + tar 打包 events/build_transcripts 到 /backups/日期目录，保留最近 7 份。
  # 生产建议用 scripts/backup.sh + 宿主机 cron 获得 VACUUM INTO 一致性快照，本服务是容器内兜底
  # （alpine 没有 sqlite3，直接 cp 主库文件，cp 前先 sync；WAL 未合并的最近写入可能不在快照里）。
  backup:
    image: alpine
    profiles: ["backup"]
    volumes:
      - lilies-data:/data:ro
      - lilies-backups:/backups
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          STAMP=$$(date +%Y%m%d-%H%M%S)
          DEST="/backups/$$STAMP"
          mkdir -p "$$DEST"
          sync
          if [ -f /data/agent_platform.db ]; then
            cp /data/agent_platform.db "$$DEST/agent_platform.db"
          fi
          for d in events build_transcripts; do
            if [ -d "/data/$$d" ]; then
              tar -czf "$$DEST/$$d.tar.gz" -C /data "$$d"
            fi
          done
          # 只保留最近 7 份（目录名按日期排序，删更旧的）
          ls -1d /backups/*/ 2>/dev/null | sort -r | tail -n +8 | xargs -r rm -rf
          echo "备份完成 → $$DEST"
          sleep 86400
        done

volumes:
  lilies-data:
  lilies-workspaces:
  lilies-backups:
