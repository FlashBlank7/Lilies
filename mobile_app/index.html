<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1677ff">
<title>钉钉自动打卡</title>
<link rel="manifest" href="/manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:linear-gradient(135deg,#1677ff 0%,#0958d9 100%);min-height:100vh;
  color:#fff;-webkit-tap-highlight-color:transparent;user-select:none}
.container{max-width:420px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0 8px}
.header h1{font-size:22px;font-weight:700;letter-spacing:1px}
.header .sub{font-size:13px;opacity:.8;margin-top:4px}
.clock-card{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);
  border-radius:20px;padding:20px;text-align:center;margin:12px 0}
.clock-time{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:2px;line-height:1.1}
.clock-date{font-size:14px;opacity:.8;margin-top:4px}
.clock-next{font-size:12px;opacity:.6;margin-top:8px}
.btn-row{display:flex;gap:12px;margin:16px 0}
.btn{flex:1;border:none;border-radius:16px;padding:18px 12px;font-size:16px;
  font-weight:600;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}
.btn-checkin{background:#52c41a;color:#fff}
.btn-checkout{background:#1677ff;color:#fff}
.btn-config{background:rgba(255,255,255,.2);color:#fff;flex:.5;font-size:20px}
.btn:disabled{opacity:.4;pointer-events:none}
.status-badge{display:inline-block;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:600;margin:8px 0}
.status-done{background:rgba(82,196,26,.3)}
.status-pending{background:rgba(255,255,255,.2)}
.history-card{background:rgba(255,255,255,.1);border-radius:16px;
  padding:12px;margin:12px 0;max-height:200px;overflow-y:auto}
.history-item{display:flex;justify-content:space-between;padding:8px 4px;
  border-bottom:1px solid rgba(255,255,255,.1);font-size:13px}
.history-item:last-child{border:none}
.history-item .time{opacity:.7}
.history-item .ok{color:#52c41a}.history-item .fail{color:#ff4d4f}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#1f1f1f;border-radius:20px;padding:24px;width:90%;max-width:380px}
.modal h3{font-size:18px;margin-bottom:16px}
.modal label{display:block;font-size:13px;opacity:.7;margin:8px 0 4px}
.modal input,.modal select{width:100%;padding:10px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);
  color:#fff;font-size:14px}
.modal input:focus{outline:none;border-color:#1677ff}
.modal .btn-row{margin-top:16px}
.modal .btn-save{background:#1677ff;color:#fff}
.modal .btn-close{background:rgba(255,255,255,.15);color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;
  background:#1f1f1f;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;
  font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.timer-bar{height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:8px}
.timer-fill{height:100%;background:#52c41a;border-radius:2px;transition:width 1s linear}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="header">
    <h1>📋 钉钉自动打卡</h1>
    <div class="sub">每天 8:45 上班 · 19:00 下班</div>
  </div>

  <div class="clock-card">
    <div class="clock-date" id="dateDisplay">---</div>
    <div class="clock-time" id="timeDisplay">--:--:--</div>
    <div class="clock-next" id="nextPunch">---</div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:0%"></div></div>
    <div id="statusBadge"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-checkin" onclick="doCheckIn()" id="btnIn">
      ☀️ 上班打卡<br><small>08:45</small>
    </button>
    <button class="btn btn-config" onclick="openConfig()">⚙️</button>
    <button class="btn btn-checkout" onclick="doCheckOut()" id="btnOut">
      🌙 下班签退<br><small>19:00</small>
    </button>
  </div>

  <div class="history-card" id="historyList">
    <div style="text-align:center;opacity:.5;padding:12px">📝 打卡记录</div>
  </div>
</div>

<!-- Config Modal -->
<div class="modal-overlay" id="configModal">
<div class="modal">
  <h3>⚙️ 配置</h3>
  <label>钉钉 API 地址</label>
  <input id="cfgApiUrl" placeholder="https://oapi.dingtalk.com/attendance/checkin">
  <label>Access Token</label>
  <input id="cfgToken" type="password" placeholder="钉钉 Access Token">
  <label>用户 ID</label>
  <input id="cfgUserId" placeholder="钉钉用户ID">
  <label>打卡经度</label>
  <input id="cfgLng" placeholder="121.4737">
  <label>打卡纬度</label>
  <input id="cfgLat" placeholder="31.2304">
  <label>打卡地址</label>
  <input id="cfgAddr" placeholder="上海市黄浦区">
  <div class="btn-row">
    <button class="btn btn-close" onclick="closeConfig()">取消</button>
    <button class="btn btn-save" onclick="saveConfig()">保存</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
//  PWA App Logic
// ═══════════════════════════════════════════════════

const STORAGE_KEY = 'dd_punch_config';
const HISTORY_KEY = 'dd_punch_history';
const CHECKIN_HOUR = 8, CHECKIN_MIN = 45;
const CHECKOUT_HOUR = 19, CHECKOUT_MIN = 0;
const TZ = 'Asia/Shanghai';

function getConfig() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : {
    apiUrl: 'https://oapi.dingtalk.com/attendance/checkin',
    token: '', userId: '', lng: '121.4737', lat: '31.2304',
    addr: '上海市黄浦区', autoCheckin: true, autoCheckout: true
  };
}

function saveConfig() {
  const cfg = {
    apiUrl: document.getElementById('cfgApiUrl').value,
    token: document.getElementById('cfgToken').value,
    userId: document.getElementById('cfgUserId').value,
    lng: document.getElementById('cfgLng').value,
    lat: document.getElementById('cfgLat').value,
    addr: document.getElementById('cfgAddr').value,
    autoCheckin: true, autoCheckout: true
  };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  closeConfig();
  toast('✅ 配置已保存');
}

function openConfig() {
  const cfg = getConfig();
  document.getElementById('cfgApiUrl').value = cfg.apiUrl;
  document.getElementById('cfgToken').value = cfg.token;
  document.getElementById('cfgUserId').value = cfg.userId;
  document.getElementById('cfgLng').value = cfg.lng;
  document.getElementById('cfgLat').value = cfg.lat;
  document.getElementById('cfgAddr').value = cfg.addr;
  document.getElementById('configModal').classList.add('show');
}

function closeConfig() {
  document.getElementById('configModal').classList.remove('show');
}

function getHistory() {
  const raw = localStorage.getItem(HISTORY_KEY);
  return raw ? JSON.parse(raw) : [];
}

function addHistory(type, success, msg) {
  const h = getHistory();
  const now = new Date();
  h.unshift({
    type, success,
    time: now.toLocaleTimeString('zh-CN', {hour12:false}),
    date: now.toLocaleDateString('zh-CN'),
    msg: msg || (success ? '成功' : '失败')
  });
  if (h.length > 50) h.length = 50;
  localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  renderHistory();
}

function renderHistory() {
  const h = getHistory();
  const el = document.getElementById('historyList');
  if (h.length === 0) {
    el.innerHTML = '<div style="text-align:center;opacity:.5;padding:12px">📝 暂无打卡记录</div>';
    return;
  }
  el.innerHTML = h.slice(0, 20).map(item =>
    `<div class="history-item">
      <span>${item.type==='checkin'?'☀️':'🌙'} ${item.date} ${item.time}</span>
      <span class="${item.success?'ok':'fail'}">${item.msg}</span>
    </div>`
  ).join('');
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

async function doPunch(type) {
  const cfg = getConfig();
  if (!cfg.token || !cfg.userId) {
    toast('⚠️ 请先配置钉钉 API 参数'); openConfig(); return;
  }
  const btn = document.getElementById(type === 'checkin' ? 'btnIn' : 'btnOut');
  btn.disabled = true;
  btn.textContent = '⏳ 打卡中...';
  const now = new Date();
  const timeStr = now.toLocaleTimeString('zh-CN', {hour12:false});

  try {
    const resp = await fetch(cfg.apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + cfg.token
      },
      body: JSON.stringify({
        userid: cfg.userId,
        location_type: '1',
        longitude: cfg.lng,
        latitude: cfg.lat,
        address: cfg.addr,
        time: timeStr
      })
    });
    const data = await resp.json();
    const ok = resp.status === 200 && (data.errcode === 0 || data.errcode === undefined);
    addHistory(type, ok, ok ? `HTTP ${resp.status}` : (data.errmsg || `错误 ${resp.status}`));
    toast(ok ? `✅ ${type==='checkin'?'上班打卡':'下班签退'}成功! ${timeStr}` : `❌ 失败: ${data.errmsg || '请检查配置'}`);
  } catch(e) {
    addHistory(type, false, '网络错误');
    toast('❌ 网络错误: ' + e.message);
  }
  btn.disabled = false;
  btn.innerHTML = type === 'checkin'
    ? '☀️ 上班打卡<br><small>08:45</small>'
    : '🌙 下班签退<br><small>19:00</small>';
}

function doCheckIn() { doPunch('checkin'); }
function doCheckOut() { doPunch('checkout'); }

// ── Clock ──
function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
  document.getElementById('timeDisplay').textContent =
    [h,m,s].map(x=>String(x).padStart(2,'0')).join(':');
  document.getElementById('dateDisplay').textContent =
    now.toLocaleDateString('zh-CN', {weekday:'long',year:'numeric',month:'long',day:'numeric'});

  // Next punch time
  const ciMins = CHECKIN_HOUR * 60 + CHECKIN_MIN;
  const coMins = CHECKOUT_HOUR * 60 + CHECKOUT_MIN;
  const nowMins = h * 60 + m;
  let nextMins;
  if (nowMins < ciMins) nextMins = ciMins;
  else if (nowMins < coMins) nextMins = coMins;
  else nextMins = ciMins + 24 * 60;

  const diff = nextMins - nowMins;
  const nextH = Math.floor(nextMins / 60) % 24;
  const nextM = nextMins % 60;
  const label = nextMins === ciMins || nextMins === ciMins + 24*60 ? '上班打卡' : '下班签退';
  document.getElementById('nextPunch').textContent =
    `下一次: ${label} ${String(nextH).padStart(2,'0')}:${String(nextM).padStart(2,'0')} (${Math.floor(diff/60)}时${diff%60}分后)`;

  // Timer bar
  let totalSpan;
  if (nowMins < ciMins) totalSpan = ciMins - (h >= CHECKOUT_HOUR ? 0 : 0);
  else if (nowMins < coMins) totalSpan = coMins - ciMins;
  else totalSpan = ciMins + 24*60 - coMins;

  const elapsed = totalSpan > 0 ? Math.min(100, Math.max(0,
    ((diff > 0 ? (totalSpan - diff) / totalSpan : 1)) * 100)) : 0;
  document.getElementById('timerFill').style.width = elapsed + '%';

  // Status badge
  const badge = document.getElementById('statusBadge');
  const today = now.toLocaleDateString('zh-CN');
  const hist = getHistory();
  const doneIn = hist.some(x => x.type==='checkin' && x.date===today && x.success);
  const doneOut = hist.some(x => x.type==='checkout' && x.date===today && x.success);
  if (doneIn && doneOut) {
    badge.innerHTML = '<span class="status-badge status-done">✅ 今日已完成</span>';
  } else if (doneIn) {
    badge.innerHTML = '<span class="status-badge status-pending">☀️ 已打卡 · 🌙待签退</span>';
  } else {
    badge.innerHTML = '<span class="status-badge status-pending">⏳ 待打卡</span>';
  }

  // Auto-punch check: fire if within the target minute and not already done today
  if (getConfig().autoCheckin && h === CHECKIN_HOUR && m === CHECKIN_MIN && s < 5 && !doneIn) {
    doPunch('checkin');
  }
  if (getConfig().autoCheckout && h === CHECKOUT_HOUR && m === CHECKOUT_MIN && s < 5 && !doneOut) {
    doPunch('checkout');
  }
}

setInterval(updateClock, 1000);
updateClock();
renderHistory();

// PWA Install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  toast('📲 点击添加到主屏幕');
});

// Close modal on backdrop tap
document.getElementById('configModal').addEventListener('click', function(e) {
  if (e.target === this) closeConfig();
});
</script>
</body>
</html>
