<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Template Marketplace — Lilies</title>
<style>
:root {
  --bg: #101215; --surface: #1b1f24; --border: #333; --text: #e8e8e8;
  --text-dim: #999; --accent: #6c8cff; --accent-dim: #4a6ad4;
  --success: #3a6; --warning: #f93; --error: #f66;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font: 14px system-ui; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── Header ── */
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
header h1 { font-size: 20px; color: var(--accent); }
header input { padding: 8px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; min-width: 280px; }
header input::placeholder { color: var(--text-dim); }
header select { padding: 8px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; }
header .nav a { color: var(--accent-dim); text-decoration: none; margin-left: 12px; }
header .nav a:hover { color: var(--accent); }
#stats { margin-left: auto; color: var(--text-dim); font-size: 12px; }

/* ── Grid ── */
main { max-width: 1400px; margin: 24px auto; padding: 0 24px; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
#loading, #empty { text-align: center; color: var(--text-dim); padding: 48px; }

/* ── Card ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; transition: all 0.2s; display: flex; flex-direction: column; gap: 12px; }
.card:hover { border-color: var(--accent-dim); transform: translateY(-2px); }
.card-header { display: flex; align-items: flex-start; gap: 10px; }
.card-icon { width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: rgba(108,140,255,.1); color: var(--accent); }
.card-title { font-size: 16px; font-weight: 600; }
.card-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.card-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.card-tags .tag { padding: 2px 10px; border-radius: 12px; font-size: 11px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: var(--text-dim); }
.card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.05); }
.card-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-dim); }
.card-stats span { display: flex; align-items: center; gap: 4px; }
.confidence-bar { width: 100%; height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; margin-top: 4px; }
.confidence-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
.conf-high { background: var(--success); }
.conf-mid { background: var(--warning); }
.conf-low { background: var(--error); }
.card-actions { display: flex; gap: 6px; }
.card-actions button { padding: 6px 14px; border-radius: 6px; font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
.card-actions button.primary { background: var(--accent-dim); border-color: var(--accent-dim); color: #fff; }
.card-actions button:hover { filter: brightness(1.2); }

/* ── Rating stars ── */
.stars { color: var(--warning); font-size: 13px; }
.stars-empty { color: var(--text-dim); }

/* ── Detail modal ── */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); z-index: 100; justify-content: center; align-items: center; }
.modal-overlay.active { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; max-width: 640px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 24px; }
.modal h2 { color: var(--accent); margin-bottom: 16px; }
.modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
.modal td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.05); }
.modal td:first-child { color: var(--text-dim); width: 100px; }
.modal .close { float: right; background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
.modal .close:hover { color: var(--text); }
.modal .deps { margin-top: 16px; background: var(--bg); padding: 12px; border-radius: 8px; font-size: 12px; color: var(--text-dim); max-height: 200px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>

<header>
  <h1>🏪 Template Marketplace</h1>
  <input id="search" type="text" placeholder="Search templates..." oninput="filter()">
  <select id="cat-filter" onchange="filter()"><option value="">All Categories</option></select>
  <span id="stats"></span>
  <span class="nav">
    <a href="/canvas.html">🖼 Canvas</a>
    <a href="/dashboard">📊 Dashboard</a>
  </span>
</header>

<main>
  <div id="loading">Loading templates...</div>
  <div id="grid"></div>
  <div id="empty" style="display:none">No templates found matching your criteria.</div>
</main>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
const token = new URLSearchParams(location.search).get('token') || '';
let allTemplates = [];

async function init() {
  try {
    const [tpls, cats] = await Promise.all([
      fetch('/api/v1/templates?' + new URLSearchParams({token})).then(r => r.json()),
      fetch('/api/v1/templates/categories?' + new URLSearchParams({token})).then(r => r.json()).catch(() => []),
    ]);
    allTemplates = tpls;

    // Category dropdown
    const sel = document.getElementById('cat-filter');
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c.replace(/_/g, ' ');
      sel.appendChild(opt);
    });

    document.getElementById('stats').textContent = `${tpls.length} templates`;
    renderGrid(tpls);
  } catch(e) {
    document.getElementById('loading').textContent = 'Cannot load templates. Ensure the API is running with templates configured.';
  }
}

function renderGrid(list) {
  const grid = document.getElementById('grid');
  document.getElementById('loading').style.display = 'none';

  if (list.length === 0) {
    grid.innerHTML = '';
    document.getElementById('empty').style.display = '';
    document.getElementById('stats').textContent = '0 templates';
    return;
  }

  document.getElementById('empty').style.display = 'none';
  document.getElementById('stats').textContent = `${list.length} templates`;

  grid.innerHTML = list.map(t => {
    const conf = t.confidence || 0.5;
    const confClass = conf >= 0.8 ? 'conf-high' : conf >= 0.5 ? 'conf-mid' : 'conf-low';
    const rating = t.rating_count > 0 ? t.rating : null;
    const usage = t.usage_count || t.total_uses || 0;
    const successRate = t.success_rate !== undefined ? Math.round(t.success_rate * 100) : null;

    return `
    <div class="card">
      <div class="card-header">
        <div class="card-icon">${t.icon === 'workflow' ? '🔀' : '📦'}</div>
        <div>
          <div class="card-title">${t.title||t.name}</div>
          <div class="card-meta">${t.author||'system'} · v${t.version||1} · ${t.category||'uncategorized'}</div>
        </div>
      </div>
      <div class="card-desc">${t.description||'No description'}</div>
      <div class="confidence-bar"><div class="confidence-fill ${confClass}" style="width:${Math.round(conf*100)}%"></div></div>
      <div class="card-tags">${(t.tags||[]).map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
      <div class="card-footer">
        <div class="card-stats">
          <span>⭐ ${rating ? rating.toFixed(1) : '---'}</span>
          <span>📊 ${conf >= 0.8 ? 'High' : conf >= 0.5 ? 'Mid' : 'Low'} confidence</span>
          <span>🔄 ${usage} uses</span>
          ${successRate !== null ? `<span>✅ ${successRate}% success</span>` : ''}
        </div>
        <div class="card-actions">
          <button onclick="showDetail('${t.name}')">Details</button>
          <button class="primary" onclick="viewInCanvas('${t.name}')">View Flow</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filter() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;

  let list = allTemplates;
  if (q) {
    list = list.filter(t =>
      (t.name||'').toLowerCase().includes(q) ||
      (t.title||'').toLowerCase().includes(q) ||
      (t.description||'').toLowerCase().includes(q) ||
      (t.tags||[]).some(tag => tag.toLowerCase().includes(q))
    );
  }
  if (cat) {
    list = list.filter(t => t.category === cat);
  }
  renderGrid(list);
}

async function showDetail(name) {
  try {
    const r = await fetch('/api/v1/templates/' + name + '?' + new URLSearchParams({token}));
    const t = await r.json();
    const conf = t.meta.confidence || 0.5;
    const confClass = conf >= 0.8 ? 'conf-high' : conf >= 0.5 ? 'conf-mid' : 'conf-low';
    const rating = t.meta.rating_count > 0 ? t.meta.rating : null;

    document.getElementById('modal').innerHTML = `
      <button class="close" onclick="closeModal()">&times;</button>
      <h2>${t.meta.title||t.meta.name}</h2>
      <div class="confidence-bar" style="margin-bottom:16px"><div class="confidence-fill ${confClass}" style="width:${Math.round(conf*100)}%"></div></div>
      <table>
        <tr><td>Name</td><td>${t.meta.name}</td></tr>
        <tr><td>Version</td><td>${t.meta.version||1}</td></tr>
        <tr><td>Category</td><td>${t.meta.category||''}</td></tr>
        <tr><td>Author</td><td>${t.meta.author||'system'}</td></tr>
        <tr><td>Tags</td><td>${(t.meta.tags||[]).join(', ')||'none'}</td></tr>
        <tr><td>Confidence</td><td>${conf.toFixed(2)}</td></tr>
        ${rating ? `<tr><td>Rating</td><td>${rating.toFixed(1)} / 5 (${t.meta.rating_count} ratings)</td></tr>`:''}
        <tr><td>Usage</td><td>${t.meta.usage_count||t.meta.total_uses||0} uses</td></tr>
        ${t.meta.success_rate !== undefined ? `<tr><td>Success Rate</td><td>${Math.round(t.meta.success_rate*100)}%</td></tr>`:''}
        <tr><td>Quality Score</td><td>${(t.meta.quality_score||0).toFixed(2)}</td></tr>
        <tr><td>Nodes</td><td>${(t.workflow?.nodes||[]).length}</td></tr>
        <tr><td>Edges</td><td>${(t.workflow?.edges||[]).length}</td></tr>
        <tr><td>Node Types</td><td>${[...new Set((t.workflow?.nodes||[]).map(n=>n.type))].join(', ')}</td></tr>
        ${t.meta.evolution_history?.length ? `<tr><td>Evolution</td><td>${t.meta.evolution_history.length} evolution events</td></tr>`:''}
      </table>
      <div class="deps">Workflow structure:\nNodes: ${(t.workflow?.nodes||[]).map(n=>n.id+' ('+n.type+')').join(', ')||'none'}\nEdges: ${(t.workflow?.edges||[]).map(e=>e.source+'→'+e.target).join(', ')||'none'}</div>
    `;
    document.getElementById('modal-overlay').classList.add('active');
  } catch(e) { alert('Cannot load template details: ' + e.message); }
}

function viewInCanvas(name) {
  window.open('/canvas.html?token=' + encodeURIComponent(token) + '#template=' + encodeURIComponent(name), '_blank');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('active');
}

init();
</script>
</body>
</html>
