<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lilies Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#0a0e27;color:#e8e8e8;min-height:100vh}
.nav{background:#11152a;padding:12px 16px;display:flex;gap:4px;
  border-bottom:1px solid #1a1f3a;position:sticky;top:0;z-index:10}
.nav button{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;
  font-size:13px;font-weight:500;background:transparent;color:#8a8fa0;transition:all .15s}
.nav button.active,.nav button:hover{background:#1a1f3a;color:#e8e8e8}
.container{max-width:900px;margin:0 auto;padding:16px}
.card{background:#11152a;border:1px solid #1a1f3a;border-radius:14px;
  padding:16px;margin:10px 0}
.card h3{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card .meta{font-size:11px;color:#6b7394;margin:4px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;
  font-weight:500;background:#1a1f3a;color:#8a8fa0;margin:2px}
.tag-green{background:rgba(82,196,26,.2);color:#52c41a}
.tag-blue{background:rgba(22,119,255,.2);color:#1677ff}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;
  font-size:12px;font-weight:500;transition:all .15s}
.btn-primary{background:#1677ff;color:#fff}
.btn-primary:hover{background:#0958d9}
.btn-ghost{background:transparent;color:#8a8fa0;border:1px solid #252a44}
.btn-ghost:hover{background:#1a1f3a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;align-items:center}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #252a44;
  background:#0a0e27;color:#e8e8e8;font-size:13px;margin:6px 0}
input:focus,textarea:focus{outline:none;border-color:#1677ff}
.conf-bar{height:4px;background:#1a1f3a;border-radius:2px;margin-top:4px}
.conf-fill{height:100%;border-radius:2px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.stat-card{background:#141832;border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:28px;font-weight:700}
.stat-label{font-size:10px;color:#6b7394;margin-top:2px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;
  background:#141832;color:#e8e8e8;padding:10px 22px;border-radius:24px;
  font-size:13px;border:1px solid #252a44;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.panel{display:none}
.panel.active{display:block}
</style>
</head>
<body>
<div class="nav">
  <button class="active" onclick="showPanel('templates')">📋 模板市场</button>
  <button onclick="showPanel('builds')">🏗️ 搭建记录</button>
  <button onclick="showPanel('sessions')">🤖 Agent会话</button>
  <button onclick="showPanel('quick')">⚡ 快速搭建</button>
</div>
<div class="container">
  <div class="toast" id="toast"></div>

  <!-- Templates Panel -->
  <div class="panel active" id="panel-templates">
    <div class="stats" id="templateStats"></div>
    <div class="row" style="margin:12px 0">
      <input type="text" id="searchQuery" placeholder="🔍 搜索模板..." oninput="loadTemplates()">
    </div>
    <div id="templateList" class="grid"></div>
  </div>

  <!-- Builds Panel -->
  <div class="panel" id="panel-builds">
    <div class="card"><div id="buildList" style="font-size:13px"></div></div>
  </div>

  <!-- Sessions Panel -->
  <div class="panel" id="panel-sessions">
    <div class="card"><div id="sessionList" style="font-size:13px">加载中...</div></div>
  </div>

  <!-- Quick Build -->
  <div class="panel" id="panel-quick">
    <div class="card">
      <h3>⚡ 快速搭建</h3>
      <textarea id="quickReq" rows="4" placeholder="输入你的需求，AI Builder 自动搭建工作流..."></textarea>
      <button class="btn btn-primary" onclick="quickBuild()" style="margin-top:8px">🚀 开始搭建</button>
      <div id="quickResult" style="margin-top:8px;font-size:13px"></div>
    </div>
  </div>
</div>

<script>
const API = '';
const TOKEN = localStorage.getItem('lilies_token') || 'test-token-2024';
localStorage.setItem('lilies_token', TOKEN);
const H = {'Authorization': 'Bearer ' + TOKEN};
let _toastTimer;

function toast(msg) {
  const e = document.getElementById('toast');
  e.textContent = msg; e.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => e.classList.remove('show'), 2500);
}

function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'templates') loadTemplates();
  else if (name === 'builds') loadBuilds();
  else if (name === 'sessions') loadSessions();
}

// ── Templates ──
async function loadTemplates() {
  const q = document.getElementById('searchQuery')?.value || '';
  const [tr, cr, sr] = await Promise.all([
    fetch(API + '/api/v1/templates?query=' + q, {headers: H}).then(r => r.json()),
    fetch(API + '/api/v1/templates/categories', {headers: H}).then(r => r.json()).catch(() => []),
    fetch(API + '/api/v1/templates/suggestions' + (q ? '?requirement=' + q : ''), {headers: H}).then(r => r.json()).catch(() => [])
  ]);

  document.getElementById('templateStats').innerHTML = [
    {num: tr.length, label: '模板总数'},
    {num: cr.length, label: '分类'},
    {num: sr.length, label: '匹配建议'},
  ].map(s => `<div class="stat-card"><div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div></div>`).join('');

  document.getElementById('templateList').innerHTML = tr.map(t => {
    const confColor = t.confidence >= 0.9 ? '#52c41a' : t.confidence >= 0.7 ? '#1677ff' : '#faad14';
    return `<div class="card">
      <div class="row"><h3>${t.icon || '📄'} ${t.title}</h3></div>
      <div class="meta">${t.category} · v${t.version} · 作者: ${t.author}</div>
      <div style="margin:4px 0">${(t.tags||[]).map(tg => `<span class="tag">${tg}</span>`).join(' ')}</div>
      <div class="conf-bar"><div class="conf-fill" style="width:${t.confidence*100}%;background:${confColor}"></div></div>
      <div class="row" style="margin-top:6px">
        <span class="meta">置信度 ${(t.confidence*100).toFixed(0)}% · ${t.usage_count||0} 使用</span>
        <button class="btn btn-primary" onclick="expandTemplate('${t.name}')">展开</button>
      </div>
      <div style="font-size:12px;color:#6b7394;margin-top:4px">${t.description||''}</div>
    </div>`;
  }).join('') || '<div class="card"><div style="text-align:center;color:#6b7394">暂无模板</div></div>';
}

async function expandTemplate(name) {
  const appR = await fetch(API + '/api/v1/applications', {method: 'POST', headers: {...H, 'Content-Type': 'application/json'},
    body: JSON.stringify({name: name + '-from-template', description: 'Expanded from template', requirement: 'Built from template.'})});
  const aid = (await appR.json()).id;
  const expandR = await fetch(API + '/api/v1/templates/' + name + '/expand?prefix=t', {method: 'POST', headers: H});
  const wf = await expandR.json();
  let draftR = await fetch(API + '/api/v1/applications/' + aid + '/draft', {headers: H});
  let rev = (await draftR.json()).revision;
  for (const n of wf.nodes) {
    const r = await fetch(API + '/api/v1/applications/' + aid + '/draft', {method: 'POST', headers: {...H, 'Content-Type': 'application/json'},
      body: JSON.stringify({expected_revision: rev, idempotency_key: 'exp-' + n.id, op: 'add_node', data: {node: n}})});
    rev = (await r.json()).revision;
  }
  for (const e of wf.edges) {
    const r = await fetch(API + '/api/v1/applications/' + aid + '/draft', {method: 'POST', headers: {...H, 'Content-Type': 'application/json'},
      body: JSON.stringify({expected_revision: rev, idempotency_key: 'exp-' + e.id, op: 'add_edge', data: {edge: e}})});
    rev = (await r.json()).revision;
  }
  // Add test + publish
  await fetch(API + '/api/v1/applications/' + aid + '/draft', {method: 'POST', headers: {...H, 'Content-Type': 'application/json'},
    body: JSON.stringify({expected_revision: rev, idempotency_key: 'exptest', op: 'add_test',
      data: {test: {name: 'Smoke', requirement: 'Template works.', inputs: {}, assertions: [], structural_only: true}}})});
  let tr = await fetch(API + '/api/v1/applications/' + aid + '/tests/run', {method: 'POST', headers: H});
  if ((await tr.json()).passed) {
    await fetch(API + '/api/v1/applications/' + aid + '/versions', {method: 'POST', headers: H});
  }
  toast('✅ 模板已展开: ' + aid.slice(0,8) + '...');
}

// ── Builds ──
async function loadBuilds() {
  const tr = await fetch(API + '/api/v1/templates/suggestions', {headers: H}).then(r => r.json()).catch(() => []);
  document.getElementById('buildList').innerHTML = '<div class="meta">最近使用 / 匹配的模板:</div>' +
    tr.slice(0,5).map(t => `<div style="padding:4px 0;border-bottom:1px solid #1a1f3a">
      <b>${t.title||t.name}</b> <span class="tag tag-blue">${(t.confidence*100).toFixed(0)}%</span></div>`).join('') +
    '<div class="meta" style="margin-top:8px">通过 Builder API 创建搭建任务后，完成时自动提取模板</div>';
}

async function loadSessions() {
  document.getElementById('sessionList').innerHTML =
    '<div class="meta">Agent 会话完成后可调用 extract-template 端点提取决策树</div>' +
    '<div class="meta" style="margin-top:4px">POST /api/v1/sessions/{id}/extract-template</div>';
}

// ── Quick Build ──
async function quickBuild() {
  const req = document.getElementById('quickReq').value;
  if (!req) { toast('请输入需求'); return; }
  const el = document.getElementById('quickResult');
  el.innerHTML = '🏗️ 创建应用中...';

  const appR = await fetch(API + '/api/v1/applications', {method: 'POST', headers: {...H, 'Content-Type': 'application/json'},
    body: JSON.stringify({name: 'QuickBuild', requirement: req})});
  const aid = (await appR.json()).id;

  const buildR = await fetch(API + '/api/v1/applications/' + aid + '/builds', {method: 'POST', headers: {...H, 'Content-Type': 'application/json'},
    body: JSON.stringify({requirement: req, auto_publish: true, max_turns: 30, max_repair_cycles: 5})});
  const bid = (await buildR.json()).build_id;

  el.innerHTML = '⏳ 搭建中... (Build ID: ' + bid.slice(0,8) + ')';

  // Poll for completion
  for (let i = 0; i < 300; i++) {
    await new Promise(r => setTimeout(r, 2000));
    const br = await fetch(API + '/api/v1/builds/' + bid, {headers: H});
    const b = await br.json();
    if (['published','ready','needs_attention','failed'].includes(b.status)) {
      el.innerHTML = b.status === 'published' ? '✅ 搭建完成并已发布!' :
        b.status === 'ready' ? '✅ 搭建完成 (待发布)' :
        '⚠️ ' + b.status + ': ' + (b.error||'').slice(0,100);
      if (b.status === 'published' || b.status === 'ready') {
        el.innerHTML += '<br><span class="meta">应用ID: ' + aid.slice(0,8) + ' | Build: ' + bid.slice(0,8) + '</span>';
        el.innerHTML += '<br><span class="meta">元认知: 构建完成后自动提取模板 (如有新决策模式)</span>';
      }
      return;
    }
    el.innerHTML = '⏳ 搭建中... (' + b.status + ', ' + (i*2) + 's)';
  }
  el.innerHTML = '⏰ 搭建超时 (Build ID: ' + bid.slice(0,8) + ')，请稍后查看';
}

// Init
loadTemplates();
</script>
</body>
</html>
