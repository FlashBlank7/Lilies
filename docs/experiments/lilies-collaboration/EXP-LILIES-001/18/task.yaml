amendment_reason: 'Revision 17 reached 58 model calls before a daemon SQLite read
  failed because generic storage transactions committed or rolled back without closing
  their connections. Revision 18 preserves the business requirement, fixtures, oracle,
  budgets, permissions, collaboration authority, model-egress gate, CAP admission,
  and acceptance from revision 17. Only the generic LiliesStorage connection lifecycle
  changes: every transaction closes after commit or rollback, setup failures also
  close, and a secondary close error cannot mask the original setup or transaction
  failure.'
