amendment_reason: Two revision 10 real-model attempts exposed that local collaboration
  request validation collapsed safe field-level errors into an opaque 422, preventing
  Lilies from correcting and routing a complete formal report. The generic T01D report
  tool now returns bounded public validation paths, types, and messages without inputs,
  secrets, context, or URLs. Revision 11 preserves the enterprise requirement, fixtures,
  oracle, budgets, collaboration authority, model-egress gate, token monitoring, and
  acceptance from revision 10; only the frozen formal-pipeline source and process
  evidence changes.
