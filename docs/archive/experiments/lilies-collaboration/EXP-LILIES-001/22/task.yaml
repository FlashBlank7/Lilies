amendment_reason: Revision 22 preserves the revision-21 business requirement, fixtures,
  hidden inputs, oracle, budget, hosts, failure denominator, and acceptance while
  replacing project-specific semantic connector aliases with the frozen hosts' official
  OpenAPI operationId values. It adds the previously omitted supplier-part and document-metadata
  reads required for unambiguous matching and duplicate evidence, and removes unsafe
  attachment and metadata writes whose official contracts lack binary request or request/response
  schemas. Those host-contract limitations remain explicit evidence debt rather than
  guessed adapters. Model access is disabled because this attempt consumes existing
  host OCR through deterministic workflow blocks and must not create provider spend.
  No prior failure is rewritten or reset.
