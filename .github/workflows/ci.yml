# CI：每次 push/PR 跑后端全量回归 + 前端类型检查。
# 测试全部使用桩 provider，不需要任何模型密钥或网络出口。
name: ci

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # 跑下限和实际开发版本各一遍。原先只测 3.13——
    # 而 pyproject 写的是 requires-python >=3.12、本地开发用的是 3.14.7，
    # 两头都没验过，">=3.12" 这句承诺等于没人担保。
    # （2026-08-29 拿 3.12.14 实跑过一遍：949 条全过，所以这个下限是真的。）
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    # 包括从空环境构建代码节点镜像；本地后端回归本身约需13分钟。
    timeout-minutes: 40
    env:
      MODEL_EGRESS_ENABLED: "false"
      OFFICIAL_AGENT_EGRESS_ENABLED: "false"
      SANDBOX_IMAGE: agent-platform-sandbox:ci
      MODELING_IMAGE: lilies-modeling:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # 后端全量测试包含实际前端环境探测和 lint/tsc；独立 frontend job
      # 的 node_modules 不会出现在此 runner，须在这里按同一锁文件安装。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: 准备前端验证环境
        working-directory: platform/frontend
        run: npm ci
      # 只开 F 类（pyflakes）：算了没用的变量、没引用的导入、
      # 重复定义、没有占位符的 f-string。这些是"代码在说谎"的信号，
      # 不是格式偏好——2026-08-29 靠它在产品代码里挖出 9 处，
      # 其中一处（_display_description 解析完快照就丢掉）
      # 函数名和实际行为完全对不上。
      # 格式类规则（E5xx 行宽之类）故意不开，那些是口味。
      - name: Ruff（只查真 bug 类）
        run: ruff check platform/backend/src --select F
      - name: 准备代码节点计算环境
        run: docker build --file Dockerfile.sandbox --tag "$SANDBOX_IMAGE" .
      - name: 准备数据分析计算环境
        run: docker build --file Dockerfile.modeling --tag "$MODELING_IMAGE" .
      - name: Pytest（全量回归）
        run: |
          # Linux挂载保留宿主所有权，容器使用创建测试目录的非root用户。
          export SANDBOX_UID="$(id -u)" SANDBOX_GID="$(id -g)"
          pytest tests/ -q -x --tb=short --junitxml=test-results/backend.xml
      - name: 保存后端测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.python-version }}
          path: test-results/backend.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: 组件测试（vitest）
        run: npx vitest run
