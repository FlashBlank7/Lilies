services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: bookstackapp
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
    volumes:
      - bookstack-db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 30

  bookstack:
    image: lscr.io/linuxserver/bookstack:version-v26.05.2
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Tokyo
      APP_URL: http://127.0.0.1:18020
      APP_KEY: ${BOOKSTACK_APP_KEY}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: bookstackapp
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      QUEUE_CONNECTION: sync
    ports:
      - "127.0.0.1:18020:80"
    volumes:
      - bookstack-app-data:/config

volumes:
  bookstack-db-data:
    name: exp-lilies-002-r1-bookstack-db-data
  bookstack-app-data:
    name: exp-lilies-002-r1-bookstack-app-data
