name: exp-lilies-004-r1

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
    volumes:
      - exp-lilies-004-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  thingsboard-ce:
    image: thingsboard/tb-node:4.3.1.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:19090:8080"
      - "127.0.0.1:18884:1883"
    environment:
      TB_SERVICE_ID: exp-lilies-004-r1
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  exp-lilies-004-postgres-data:
    name: exp-lilies-004-r1-postgres-data
