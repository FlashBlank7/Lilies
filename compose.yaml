services:
  web:
    build: ./platform/frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AGENT_PLATFORM_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-change-me}
    depends_on:
      - api
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      WORKSPACE_ROOT: /workspaces
      WORKSPACE_HOST_ROOT: ${PWD}/workspaces
      SANDBOX_IMAGE: agent-platform-sandbox:latest
      SANDBOX_UID: ${SANDBOX_UID:-10001}
      SANDBOX_GID: ${SANDBOX_GID:-10001}
    volumes:
      - ./data:/app/data
      - ./workspaces:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
  sandbox-image:
    image: agent-platform-sandbox:latest
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    profiles: ["build-only"]
