[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-platform"
version = "0.1.0"
description = "Provider-neutral Python agent backend reconstructed from the intelligent core of the TypeScript source snapshot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "pyyaml>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=16,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
agent-platform = "agent_platform.cli:main"
agent-platform-worker = "agent_platform.worker_runner:main"

[tool.hatch.build.targets.wheel]
packages = ["platform/backend/src/agent_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
